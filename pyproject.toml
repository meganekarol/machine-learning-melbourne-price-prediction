[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "melbourne-price"
version = "2.0.0"
description = "Melbourne house price prediction: scikit-learn Gradient Boosting pipeline served with FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    # The saved model in models/ is pickled with this scikit-learn version.
    "scikit-learn==1.9.1",
    "joblib>=1.4",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.8"]
notebooks = ["jupyter", "matplotlib>=3.9", "seaborn>=0.13"]
demo = ["streamlit>=1.40"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "streamlit>=1.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
